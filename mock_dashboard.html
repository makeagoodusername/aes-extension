
    <!DOCTYPE html>
    <html>
    <body>
    <button onclick="window.AesCanopyAdminDashboard.open()">Open Canopy Admin Dashboard</button>
    <script>
    window.chrome = {
        storage: {
            local: {
                get: async function(keys) {
                    const data = {
                        "TESTSERVERMyAirline1accounting:index": [{weekId: 100}],
                        "TESTSERVERMyAirline2accounting:index": [{weekId: 100}],
                        "TESTSERVERMyAirline3accounting:index": [{weekId: 100}],
                        "TESTSERVERMyAirline1accounting:bank:100": { payload: { cashBalance: 50000000 } },
                        "TESTSERVERMyAirline2accounting:bank:100": { payload: { cashBalance: 25000000 } },
                        "TESTSERVERMyAirline3accounting:bank:100": { payload: { cashBalance: 12000000 } }
                    };
                    let result = {};
                    if (Array.isArray(keys)) {
                        keys.forEach(k => { if (data[k]) result[k] = data[k]; });
                    }
                    return result;
                }
            }
        }
    };
    window.AES = {
        getServer: () => "TESTSERVER",
        getAirlineIdentity: () => "MyAirline1"
    };
    window.AesAccountRegistry = {
        get: async () => ({
            "acc1": { server: "TESTSERVER", airline: "MyAirline1", company: "Company One" },
            "acc2": { server: "TESTSERVER", airline: "MyAirline2", company: "Company Two" },
            "acc3": { server: "TESTSERVER", airline: "MyAirline3", company: "Company Three" }
        })
    };
    </script>
    <script src="./modules/canopy/admin-dashboard.js"></script>
    </body>
    </html>
