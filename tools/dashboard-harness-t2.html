<script>
(function(){
  // In-memory storage shim
  const _storage = {local: new Map(), session: new Map(), sync: new Map()};
  const _listeners = [];
  function _toObj(map, keys) {
    const out = {};
    if (keys === null || keys === undefined) {
      for (const [k,v] of map) out[k]=v;
      return out;
    }
    if (Array.isArray(keys)) {
      for (const k of keys) if (map.has(k)) out[k]=map.get(k);
      return out;
    }
    if (typeof keys === 'string') {
      if (map.has(keys)) out[keys]=map.get(keys);
      return out;
    }
    if (typeof keys === 'object') {
      for (const k in keys) {
        out[k] = map.has(k) ? map.get(k) : keys[k];
      }
      return out;
    }
    return out;
  }
  function _set(map, items, area) {
    const changes = {};
    for (const k in items) {
      const oldValue = map.get(k);
      changes[k] = {oldValue, newValue: items[k]};
      map.set(k, items[k]);
    }
    setTimeout(() => {
      for (const cb of _listeners) {
        try { cb(changes, area); } catch (e) {}
      }
    }, 0);
    return Promise.resolve();
  }
  function area(map, name) {
    return {
      get: (keys) => Promise.resolve(_toObj(map, keys === undefined ? null : keys)),
      set: (items) => _set(map, items, name),
      remove: (keys) => {
        if (typeof keys === 'string') keys = [keys];
        for (const k of keys) map.delete(k);
        return Promise.resolve();
      },
      clear: () => { map.clear(); return Promise.resolve(); }
    };
  }
  const chromeStub = {
    storage: {
      local: area(_storage.local, "local"),
      session: area(_storage.session, "session"),
      sync: area(_storage.sync, "sync"),
      onChanged: {
        addListener: (cb) => _listeners.push(cb),
        removeListener: (cb) => {
          const i = _listeners.indexOf(cb); if (i>=0) _listeners.splice(i,1);
        }
      }
    },
    runtime: {
      getManifest: () => ({version: "0.0.0-harness", name: "AES Harness", manifest_version: 3}),
      getURL: (p) => "../" + p,
      sendMessage: () => Promise.resolve(),
      onMessage: {addListener: () => {}, removeListener: () => {}},
      lastError: null,
      id: "harness"
    },
    tabs: {
      query: () => Promise.resolve([]),
      create: () => Promise.resolve({id: 1}),
      remove: () => Promise.resolve(),
      update: () => Promise.resolve(),
      onUpdated: {addListener: () => {}, removeListener: () => {}},
      onRemoved: {addListener: () => {}, removeListener: () => {}}
    }
  };
  if (typeof window.chrome === 'undefined' || !window.chrome.storage) {
    window.chrome = chromeStub;
  } else {
    // Real Chrome present; merge in missing pieces
    if (!window.chrome.storage) window.chrome.storage = chromeStub.storage;
  }
  // AES global is built up in helpers.js; pre-stub a body className that AS uses
  document.body.classList.add("as-page-dashboard");
  // Stub the dashboard meta — content_dashboard reads server date from a span
  const meta = document.createElement("span");
  meta.id = "as-server-date-meta";
  meta.style.display = "none";
  meta.innerText = "Wed, 30. Apr 2026 10:00";
  document.body.appendChild(meta);
})();
</script>
