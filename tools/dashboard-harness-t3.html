    <script>
      if (typeof chrome === "undefined" || !chrome.storage) {
        window._fakeStorage = {};
        window.chrome = window.chrome || {};
        window.chrome.storage = {
          local: {
            get: (keys) => new Promise((resolve) => {
              if (keys === null || keys === undefined) { resolve({...window._fakeStorage}); return; }
              const k = Array.isArray(keys) ? keys : (typeof keys === "string" ? [keys] : Object.keys(keys));
              const out = {};
              for (const key of k) {
                if (key in window._fakeStorage) out[key] = window._fakeStorage[key];
                else if (typeof keys === "object" && !Array.isArray(keys)) out[key] = keys[key];
              }
              resolve(out);
            }),
            set: (obj) => new Promise((resolve) => {
              const changes = {};
              for (const k in obj) {
                changes[k] = {oldValue: window._fakeStorage[k], newValue: obj[k]};
                window._fakeStorage[k] = obj[k];
              }
              for (const cb of (window._chromeStorageListeners || [])) {
                try { cb(changes, "local"); } catch (_) {}
              }
              resolve();
            }),
            remove: (keys) => new Promise((resolve) => {
              const arr = Array.isArray(keys) ? keys : [keys];
              for (const k of arr) delete window._fakeStorage[k];
              resolve();
            })
          },
          onChanged: {
            addListener: (cb) => {
              window._chromeStorageListeners = window._chromeStorageListeners || [];
              window._chromeStorageListeners.push(cb);
            },
            removeListener: (cb) => {
              if (!window._chromeStorageListeners) return;
              const i = window._chromeStorageListeners.indexOf(cb);
              if (i >= 0) window._chromeStorageListeners.splice(i, 1);
            }
          }
        };
        window.chrome.runtime = window.chrome.runtime || {
          getManifest: () => ({version: "0.0.0-harness", name: "AES T3 Harness", manifest_version: 3}),
          getURL: (p) => "../" + p,
          id: "harness",
          sendMessage: () => Promise.resolve(),
          onMessage: {addListener: () => {}}
        };
        window.chrome.alarms = window.chrome.alarms || {
          create: () => {},
          clear: () => Promise.resolve(),
          onAlarm: {addListener: () => {}}
        };
      }
    </script>
