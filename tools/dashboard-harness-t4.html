<h1>Tile Harness — T4 (slim)</h1>
<div id="harness-log"></div>
<div id="enterprise-dashboard" style="border:1px solid #aaa;padding:8px;background:#fff;min-height:60px;"></div>

<script>
(function(){
  if (!window.chrome) window.chrome = {};
  if (!chrome.storage) {
    const _data = {};
    const _listeners = [];
    chrome.storage = {
      local: {
        get: (keys) => {
          let result = {};
          if (keys === null || keys === undefined) {
            result = Object.assign({}, _data);
          } else if (typeof keys === 'string') {
            if (keys in _data) result[keys] = _data[keys];
          } else if (Array.isArray(keys)) {
            for (const k of keys) if (k in _data) result[k] = _data[k];
          } else if (typeof keys === 'object') {
            for (const k in keys) result[k] = (k in _data) ? _data[k] : keys[k];
          }
          return Promise.resolve(result);
        },
        set: (obj) => {
          const changes = {};
          for (const k in obj) { changes[k] = {oldValue: _data[k], newValue: obj[k]}; _data[k] = obj[k]; }
          for (const fn of _listeners) try { fn(changes, 'local'); } catch(e){}
          return Promise.resolve();
        },
        remove: (keys) => {
          if (typeof keys === 'string') keys = [keys];
          const changes = {};
          for (const k of keys) { if (k in _data) { changes[k] = {oldValue: _data[k], newValue: undefined}; delete _data[k]; } }
          for (const fn of _listeners) try { fn(changes, 'local'); } catch(e){}
          return Promise.resolve();
        }
      },
      onChanged: {
        addListener: fn => _listeners.push(fn),
        removeListener: fn => { const i = _listeners.indexOf(fn); if (i>=0) _listeners.splice(i,1); }
      }
    };
  }
  if (!chrome.runtime) {
    chrome.runtime = {
      id: 'harness-stub',
      sendMessage: (msg, cb) => { if(cb) cb({}); return Promise.resolve({}); },
      onMessage: { addListener: ()=>{} },
      getURL: (p) => '../' + p,
      getManifest: () => ({version: '0.0.0-harness'})
    };
  }
  window.__harnessLog = function(level){
    var args = Array.prototype.slice.call(arguments, 1);
    const el = document.getElementById('harness-log');
    if (!el) return;
    const line = document.createElement('div');
    line.style.color = (level==='error')?'#f99':(level==='warn')?'#fc6':'#cfc';
    line.textContent = '['+level+'] '+ args.map(function(a){try{return typeof a==='string'?a:JSON.stringify(a);}catch(e){return String(a);}}).join(' ');
    el.appendChild(line); el.scrollTop = el.scrollHeight;
  };
  const _ce = console.error.bind(console), _cw = console.warn.bind(console);
  console.error = function(){var a = Array.prototype.slice.call(arguments); __harnessLog.apply(null, ['error'].concat(a)); _ce.apply(null, a);};
  console.warn  = function(){var a = Array.prototype.slice.call(arguments); __harnessLog.apply(null, ['warn'].concat(a));  _cw.apply(null, a);};
  window.addEventListener('error', function(e){ __harnessLog('error', 'window.onerror', e.message, e.filename+':'+e.lineno); });
  window.addEventListener('unhandledrejection', function(e){ __harnessLog('error', 'unhandledRejection', String(e.reason && e.reason.stack || e.reason)); });
})();
</script>

document.addEventListener('DOMContentLoaded', function(){

    try {
      const anchor = document.getElementById("enterprise-dashboard");
      const shell = new window.CentralHubShell({server: "free1", airline: "FA"});
      window.__aesCentralHub = shell;
      await shell.mount(anchor);
