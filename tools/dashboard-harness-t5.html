<div id="harness-log"></div>
<div id="enterprise-dashboard"></div>

<script>
(function(){
  // chrome.* shim — harness runs at file:// origin, so the real
  // extension APIs are not available. Provide an in-memory storage,
  // a runtime stub, and a no-op messaging stub so the modules under
  // audit reach their persistence calls without the harness throwing.
  if (!window.chrome) window.chrome = {};
  if (!chrome.storage) {
    const _data = {};
    const _listeners = [];
    chrome.storage = {
      local: {
        get: (keys, cb) => {
          let result = {};
          if (keys === null || keys === undefined) {
            result = Object.assign({}, _data);
          } else if (typeof keys === 'string') {
            if (keys in _data) result[keys] = _data[keys];
          } else if (Array.isArray(keys)) {
            for (const k of keys) if (k in _data) result[k] = _data[k];
          } else if (typeof keys === 'object') {
            for (const k in keys) result[k] = (k in _data) ? _data[k] : keys[k];
          }
          if (cb) { try { cb(result); } catch(e){} return; }
          return Promise.resolve(result);
        },
        set: (obj, cb) => {
          const changes = {};
          for (const k in obj) { changes[k] = {oldValue: _data[k], newValue: obj[k]}; _data[k] = obj[k]; }
          for (const fn of _listeners) try { fn(changes, 'local'); } catch(e){}
          if (cb) { try { cb(); } catch(e){} return; }
          return Promise.resolve();
        },
        remove: (keys, cb) => {
          if (typeof keys === 'string') keys = [keys];
          const changes = {};
          for (const k of keys) { if (k in _data) { changes[k] = {oldValue: _data[k], newValue: undefined}; delete _data[k]; } }
          for (const fn of _listeners) try { fn(changes, 'local'); } catch(e){}
          if (cb) { try { cb(); } catch(e){} return; }
          return Promise.resolve();
        }
      },
      onChanged: {
        addListener: fn => _listeners.push(fn),
        removeListener: fn => { const i = _listeners.indexOf(fn); if (i>=0) _listeners.splice(i,1); }
      }
    };
  }
  if (!chrome.runtime) {
    chrome.runtime = {
      id: 'harness-stub',
      sendMessage: (msg, cb) => { if(cb) cb({}); return Promise.resolve({}); },
      onMessage: { addListener: ()=>{} },
      onInstalled: { addListener: ()=>{} },
      getURL: (p) => '../' + p,
      getManifest: () => ({version:'0.6.12-harness', name:'AES Harness'})
    };
  }
  // Logging plumbing.
  function appendLog(level, ...args){
    const el = document.getElementById('harness-log'); if (!el) return;
    const line = document.createElement('div');
    line.style.color = (level==='error')?'#f99':(level==='warn')?'#fc6':'#cfc';
    line.textContent = '['+level+'] '+ args.map(a=>{try{return typeof a==='string'?a:JSON.stringify(a);}catch(e){return String(a);}}).join(' ');
    el.appendChild(line); el.scrollTop = el.scrollHeight;
  }
  window.__harnessLog = appendLog;
  const _ce = console.error.bind(console), _cw = console.warn.bind(console);
  console.error = function(...a){appendLog('error',...a); _ce(...a);};
  console.warn = function(...a){appendLog('warn',...a); _cw(...a);};
  window.addEventListener('error', e => appendLog('error', 'window.onerror', e.message, e.filename+':'+e.lineno));
  window.addEventListener('unhandledrejection', e => appendLog('error', 'unhandledRejection', String(e.reason && e.reason.stack || e.reason)));
})();
</script>
