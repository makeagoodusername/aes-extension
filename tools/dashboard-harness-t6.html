window.__t6_runMount = async function(){
    const dump = {
        CentralHubShell: typeof window.CentralHubShell,
        CentralHubTile: typeof window.CentralHubTile,
        CentralHubSettings: typeof window.CentralHubSettings,
        registry: !!window.CentralHubTileRegistry,
        tileCount: window.CentralHubTileRegistry ? window.CentralHubTileRegistry.all().length : 0,
        autoMounted: !!document.getElementById("aes-central-hub")
    };
    document.title = "T6: tiles=" + dump.tileCount + " auto=" + dump.autoMounted;
    window.__t6_dump = dump;
    console.warn("[T6 harness] post-load dump", JSON.stringify(dump));
    return dump;
};
window.addEventListener("DOMContentLoaded", function(){
    setTimeout(window.__t6_runMount, 1500);
});
